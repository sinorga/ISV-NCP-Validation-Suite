# GCP Observability Validation Configuration.
#
# Imports the provider-agnostic observability contract from
# suites/observability.yaml and wires every step to a Compute Engine /
# Cloud Logging / Resource Manager stub under
# providers/gcp/scripts/observability/.
#
# The AWS realism oracle (providers/aws/config/observability.yaml) reuses the
# network + bare_metal scripts for setup/teardown and adds three
# observability-specific scripts. GCP authors dedicated observability stubs for
# every step because the target contract diverges from the generic network/vm
# scripts (per-subnet flow-log ownership allowlist, region-scoped host zone
# walk, and the provider-hidden BMC path).
#
# Steps mirror the AWS oracle order (plus a GCP-specific east-west telemetry peer):
#   1. create_network        (setup)   - custom-mode VPC + 1 regional subnetwork.
#   2. enable_vpc_flow_logs  (setup)   - patch VPC Flow Logs on the run-created
#                                        subnetworks (flow_sampling=1.0, no filter).
#   3. launch_host           (setup)   - launch a CPU host on the subnet, inject
#                                        an SSH key via metadata, open an SSH
#                                        firewall, wait for guest readiness.
#   4. launch_telemetry_peer (setup)   - launch one internal-only east-west peer
#                                        in the same subnet behind a source-scoped
#                                        ICMP firewall admitting only the host /32.
#   5. vpc_flow_logs         (test)    - read Subnetwork.log_config + scoped
#                                        Cloud Logging query for the vpc_flows log.
#   6. host_syslogs          (test)    - SSH the host, sample journalctl/dmesg.
#   7. bmc_sel_logs          (test)    - provider-hidden (managed BMC plane).
#   8. bmc_gpu_telemetry     (test)    - provider-hidden (managed BMC plane).
#   9-24. v0.9.0 telemetry/log (test)  - the sixteen released telemetry/log
#                                        validators. Each has a wired step + real
#                                        GCP SDK stub (mirroring the AWS oracle's
#                                        stub set) and every one is enabled here
#                                        (none is excluded): the ten
#                                        provider-owned physical planes pass the
#                                        validator provider-hidden path after a
#                                        real get_project identity probe, and the
#                                        six tenant-visible planes emit concrete
#                                        Cloud Logging vpc_flows / Compute disk /
#                                        Cloud Monitoring evidence generated by a
#                                        bounded run-scoped traffic / I-O fixture.
#  25. teardown_telemetry_peer(teardown)- delete the peer + its source-scoped ICMP
#                                        firewall (before the host and VPC).
#  26. teardown_host         (teardown)- delete host, SSH firewall, local key.
#  27. teardown_flow_logs    (teardown)- disable flow logs on run-patched subnets.
#  28. teardown_network      (teardown)- delete run-owned subnets + the VPC.
#
# There is no customer-accessible Compute Engine BMC SEL / Redfish GPU telemetry
# API, so bmc_sel_logs / bmc_gpu_telemetry emit provider-hidden evidence after a
# real Resource Manager project-identity probe (mirrors the AWS oracle + the GCP
# security BMC pattern). Google documents guest GPU metrics via Ops Agent / NVML
# / DCGM only; those are never relabeled as BMC telemetry.
#
# Operator env vars (all OPTIONAL overrides with safe public defaults) plus the
# cross-cutting REQUIRED NETWORK_FIREWALL_TRUST_IP consumed by launch_host's SSH
# firewall — see docs/references/gcp.md and the domain guide
# providers/gcp/scripts/observability/docs/gcp-observability.md.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/gcp/config/observability.yaml

import:
  - ../../../suites/observability.yaml

version: "1.0"

commands:
  observability:
    phases: ["setup", "test", "teardown"]
    steps:
      # 1. Custom-mode VPC + one regional subnetwork (no CIDR on the network;
      # the subnetwork owns the /24 carved from --cidr). Emits network_id, the
      # subnets evidence list, the exact created_subnets allowlist, and
      # network_created. Worst-case internal wait stack is the global VPC insert
      # op (120s) + the regional subnet insert op (180s) + region lookup +
      # read-back gets; 420s is margin over that ~300s sum.
      - name: create_network
        phase: setup
        command: "python3 ../scripts/observability/create_network.py"
        args:
          - "--name"
          - "isv-observability-net"
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "{{network_cidr}}"
          # Skip-teardown preservation reaches the setup producers too: when
          # GCP_OBSERVABILITY_SKIP_TEARDOWN is set, --skip-destroy suppresses the
          # compensating deletion a setup FAILURE would otherwise run, so an
          # operator can inspect the exact run-owned network/subnetworks. Unset ->
          # normal compensating cleanup (the empty flag is dropped by the renderer).
          - "{{teardown_flag}}"
        timeout: 420

      # 2. Patch VPC Flow Logs onto ONLY the run-created subnetworks (the
      # forwarded created_subnets allowlist), flow_sampling=1.0, INCLUDE_ALL
      # metadata, no filter, then read back the effective config. Emits the exact
      # patched_flow_log_subnets (the only list teardown disables), the OBSERVED
      # flow_log_subnets diagnostic list, and flow_logs_created. One regional
      # patch op + read-back; 300s headroom.
      - name: enable_vpc_flow_logs
        phase: setup
        command: "python3 ../scripts/observability/setup_vpc_flow_logs.py"
        args:
          - "--region"
          - "{{region}}"
          - "--network-id"
          - "{{steps.create_network.network_id}}"
          - "--network-created"
          - "{{steps.create_network.network_created | default('false')}}"
          - "--created-subnets"
          - "{{steps.create_network.created_subnets | join(',') | default('none', true)}}"
        timeout: 300

      # 3. Launch the syslog-probe host on the run subnet. Injects the local SSH
      # public key via ssh-keys metadata, opens a tcp/22 firewall sourced ONLY
      # from NETWORK_FIREWALL_TRUST_IP (no open-internet fallback), walks the
      # operator region's zones on stockout, and waits for stable SSH. Emits
      # instance_id, zone, leaked_zones, public_ip, key_file, ssh_user, and the
      # instance/firewall/key created flags. Worst-case internal wait stack:
      # firewall op (120s) + per-zone insert op (300s) + RUNNING poll (300s) +
      # public-IP poll (120s) + SSH readiness (~680s) = ~1520s; internal waits are
      # deadline-bounded so 1800s is real margin over that sum.
      - name: launch_host
        phase: setup
        command: "python3 ../scripts/observability/launch_host.py"
        args:
          - "--name"
          - "isv-observability-host"
          - "--instance-type"
          - "{{instance_type}}"
          - "--region"
          - "{{region}}"
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--subnet-id"
          - "{{steps.create_network.subnets[0].subnet_id}}"
          - "--ami-id"
          - "{{image}}"
          - "--image-project"
          - "{{image_project}}"
          - "--firewall-name"
          - "isv-observability-ssh"
          - "--key-name"
          - "isv-observability-host-key"
          - "--ssh-user"
          - "{{ssh_user}}"
          # --skip-destroy (from GCP_OBSERVABILITY_SKIP_TEARDOWN) suppresses the
          # setup-failure compensating deletion of the accepted instance, SSH
          # firewall, and local key so they survive for inspection; unset -> normal
          # compensating cleanup.
          - "{{teardown_flag}}"
        timeout: 1800

      # Launch one internal-only peer in the same run-owned subnet. Its ICMP
      # firewall admits only the primary host's exact /32, and its emitted name,
      # private IP, zone, and ownership flags bind east-west evidence and cleanup.
      - name: launch_telemetry_peer
        phase: setup
        command: "python3 ../scripts/observability/launch_telemetry_peer.py"
        args:
          - "--name"
          - "isv-observability-peer"
          - "--firewall-name"
          - "isv-observability-peer-icmp"
          - "--zone"
          - "{{steps.launch_host.zone}}"
          - "--network-id"
          - "{{steps.create_network.network_id}}"
          - "--subnet-id"
          - "{{steps.create_network.subnets[0].subnet_id}}"
          - "--source-private-ip"
          - "{{steps.launch_host.private_ip}}"
          # The internal peer only answers bounded ICMP; a literal e2-small is
          # sufficient (independent of the primary host instance_type).
          - "--instance-type"
          - "e2-small"
          - "--image"
          - "{{image}}"
          - "--image-project"
          - "{{image_project}}"
          # --skip-destroy (from GCP_OBSERVABILITY_SKIP_TEARDOWN) suppresses the
          # setup-failure compensating deletion of the accepted peer instance and
          # its source-scoped ICMP firewall; unset -> normal compensating cleanup.
          - "{{teardown_flag}}"
        timeout: 720

      # 4. VPC Flow Logs availability. Reads live Subnetwork.log_config for the
      # target network (flow_logs_configured / traffic_type_all) and runs a
      # project-scoped Cloud Logging query against the compute vpc_flows log
      # (flow_log_endpoint_reachable / log_destination_accessible). Subnet reads
      # + one bounded logging query; 300s headroom.
      - name: vpc_flow_logs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--network-id"
          - "{{steps.create_network.network_id}}"
          - "--aspect"
          - "vpc_flow_logs"
        timeout: 300

      # 5. Guest host syslogs over SSH (journalctl, dmesg fallback). SSH-readiness
      # poll (~200s internal) + sampling; 600s headroom.
      - name: host_syslogs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "host_syslogs"
          - "--host"
          - "{{steps.launch_host.public_ip}}"
          - "--key-file"
          - "{{steps.launch_host.key_file}}"
          - "--ssh-user"
          - "{{ssh_user}}"
        timeout: 600

      # 6. BMC SEL logs — provider-hidden after a real Resource Manager project
      # identity probe. Single get_project call; 180s API floor.
      - name: bmc_sel_logs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "bmc_sel_logs"
        timeout: 180

      # 7. BMC GPU telemetry — provider-hidden after a real Resource Manager
      # project identity probe. Single get_project call; 180s API floor.
      - name: bmc_gpu_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "bmc_gpu_telemetry"
        timeout: 180

      # ── Observability suite v0.9.0 telemetry/log validators (all enabled) ──
      # The suite adds sixteen released telemetry/log validators; each has a
      # wired step here (mirroring the AWS oracle's stub set under
      # providers/aws/scripts/observability/) and every one is enabled (none is
      # excluded). Every stub makes a real GCP SDK call on its main path — Cloud
      # Logging vpc_flows for the tenant-visible network/delivery planes, Cloud
      # Monitoring persistent-disk series + guest df for storage, and a Resource
      # Manager get_project identity probe for the ten provider-owned physical
      # planes (which pass the validator provider-hidden path). The six
      # tenant-visible planes first generate a bounded run-scoped traffic / I-O
      # fixture over the launched host's injected-key SSH boundary (VPC Flow Logs
      # and disk metrics record only real flows / I-O), then poll for the
      # non-immediate telemetry. Every step is continue_on_failure so a probe that
      # legitimately finds no data never aborts the phase or teardown.

      # 8. Telemetry delivery latency — freshest queryable vpc_flows record age
      # (Cloud Logging), scope-bound to the run subnetworks.
      - name: telemetry_delivery_latency
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/telemetry_delivery_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--network-id"
          - "{{steps.create_network.network_id | default('none', true)}}"
          - "--instance-id"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--host"
          - "{{steps.launch_host.public_ip | default('none', true)}}"
          - "--key-file"
          - "{{steps.launch_host.key_file | default('none', true)}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--max-delivery-seconds"
          - "{{max_delivery_seconds}}"
        # SSH traffic fixture (~90s) + vpc_flows delivery poll + subnet list +
        # per-iteration queries. The poll ceiling scans a window WIDER than the
        # pass threshold (max_delivery_seconds 600 + DELIVERY_MEASURE_MARGIN 60 =
        # 660s) so a slow-but-in-budget delivery is still caught and an over-budget
        # one is measured, not abandoned early. Worst-case ~90s + 660s + ~30s ≈
        # 780s; 900s holds real margin over that stack so a slow flow-log delivery
        # returns honest JSON instead of a SIGKILL.
        timeout: 900

      # 9. North-south network telemetry — a bounded external-traffic fixture on
      # the host, then a scope-bound vpc_flows poll (Cloud Logging) for flows with
      # an external endpoint.
      - name: north_south_network_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/network_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--network-id"
          - "{{steps.create_network.network_id | default('none', true)}}"
          - "--instance-id"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--zone"
          - "{{steps.launch_host.zone | default('none', true)}}"
          - "--host"
          - "{{steps.launch_host.public_ip | default('none', true)}}"
          - "--key-file"
          - "{{steps.launch_host.key_file | default('none', true)}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--aspect"
          - "north_south_network_telemetry"
        # SSH traffic fixture (~90s) + 300s vpc_flows poll + subnet list. 660s
        # margin over that ~390s stack.
        timeout: 660

      # 10. East-west network telemetry — a bounded in-subnet-traffic fixture on
      # the host, then a scope-bound vpc_flows poll for flows internal to run VMs.
      - name: east_west_network_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/network_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--network-id"
          - "{{steps.create_network.network_id | default('none', true)}}"
          - "--instance-id"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--zone"
          - "{{steps.launch_host.zone | default('none', true)}}"
          - "--host"
          - "{{steps.launch_host.public_ip | default('none', true)}}"
          - "--key-file"
          - "{{steps.launch_host.key_file | default('none', true)}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--private-ip"
          - "{{steps.launch_host.private_ip | default('none', true)}}"
          - "--peer-instance-id"
          - "{{steps.launch_telemetry_peer.instance_id | default('none', true)}}"
          - "--peer-private-ip"
          - "{{steps.launch_telemetry_peer.private_ip | default('none', true)}}"
          - "--aspect"
          - "east_west_network_telemetry"
        # SSH traffic fixture (~90s) + 300s vpc_flows poll + subnet list. 660s
        # margin over that ~390s stack.
        timeout: 660

      # 11. Management network telemetry — provider-hidden physical plane
      # (get_project identity probe; no tenant endpoint).
      - name: management_network_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/network_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "management_network_telemetry"
        timeout: 180

      # 12. NVSwitch fabric telemetry — provider-hidden physical plane.
      - name: nvswitch_fabric_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/network_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "nvswitch_fabric_telemetry"
        timeout: 180

      # 13. Host NIC network telemetry — real interface inventory (Compute get) +
      # a bounded external-traffic fixture, then instance-scoped vpc_flows poll.
      - name: host_nic_network_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/network_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--network-id"
          - "{{steps.create_network.network_id | default('none', true)}}"
          - "--instance-id"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--zone"
          - "{{steps.launch_host.zone | default('none', true)}}"
          - "--host"
          - "{{steps.launch_host.public_ip | default('none', true)}}"
          - "--key-file"
          - "{{steps.launch_host.key_file | default('none', true)}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--aspect"
          - "host_nic_network_telemetry"
        # SSH traffic fixture (~90s) + 300s vpc_flows poll + instance get + subnet
        # list. 660s margin over that ~400s stack.
        timeout: 660

      # 14. Storage capacity telemetry — real Compute disk enumeration joined to
      # guest filesystem used/free/total read over SSH (df); provisioned disk size
      # is never substituted.
      - name: storage_capacity_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/storage_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--instance-id"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--zone"
          - "{{steps.launch_host.zone | default('none', true)}}"
          - "--host"
          - "{{steps.launch_host.public_ip | default('none', true)}}"
          - "--key-file"
          - "{{steps.launch_host.key_file | default('none', true)}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--aspect"
          - "storage_capacity_telemetry"
        # Instance get + a single guest df read over SSH (~30s). 360s holds margin.
        timeout: 360

      # 15. Storage performance telemetry — a bounded write+read I-O fixture on the
      # host, then instance-scoped Cloud Monitoring persistent-disk series for
      # bandwidth/iops/latency. The stub runs the SSH I-O fixture (~150s) then
      # polls up to 300s (DEFAULT_POLL_TIMEOUT_SECONDS) for the lagging GAUGE
      # latency series to ingest, on top of instance-get + monitoring build +
      # initial/per-iteration timeSeries queries. Cap must strictly exceed that
      # ~450s stack so the step returns honest JSON in its slow case instead of a
      # SIGKILL; 600s holds ~150s margin.
      - name: storage_performance_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/storage_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--instance-id"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--zone"
          - "{{steps.launch_host.zone | default('none', true)}}"
          - "--host"
          - "{{steps.launch_host.public_ip | default('none', true)}}"
          - "--key-file"
          - "{{steps.launch_host.key_file | default('none', true)}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--aspect"
          - "storage_performance_telemetry"
        timeout: 600

      # 16. GPU NVLink telemetry — provider-hidden physical plane.
      - name: gpu_nvlink_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/nvlink_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "gpu_nvlink_telemetry"
        timeout: 180

      # 17. Switch NVLink telemetry — provider-hidden physical plane.
      - name: switch_nvlink_telemetry
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/nvlink_telemetry_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "switch_nvlink_telemetry"
        timeout: 180

      # 18. Fabric manager logs — provider-hidden physical fabric plane.
      - name: fabric_manager_logs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "fabric_manager_logs"
        timeout: 180

      # 19. UFM event logs — provider-hidden physical fabric plane.
      - name: ufm_event_logs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "ufm_event_logs"
        timeout: 180

      # 20. Subnet manager logs — provider-hidden physical fabric plane.
      - name: subnet_manager_logs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "subnet_manager_logs"
        timeout: 180

      # 21. General switch logs — provider-hidden physical switch plane.
      - name: general_switch_logs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "general_switch_logs"
        timeout: 180

      # 22. Switch syslogs — provider-hidden physical switch plane.
      - name: switch_syslogs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "switch_syslogs"
        timeout: 180

      # 23. Switch kernel logs — provider-hidden physical switch plane.
      - name: switch_kernel_logs
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/observability/log_availability_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "switch_kernel_logs"
        timeout: 180

      # Delete the internal telemetry peer and its source-scoped ICMP firewall
      # before the primary host or VPC. The existing teardown helper consumes
      # the peer step's exact identities and ownership flags.
      - name: teardown_telemetry_peer
        phase: teardown
        command: "python3 ../scripts/observability/teardown_host.py"
        args:
          - "--instance-id"
          - "{{steps.launch_telemetry_peer.instance_id | default('none', true)}}"
          - "--region"
          - "{{region}}"
          - "--zone"
          - "{{steps.launch_telemetry_peer.zone | default('none', true)}}"
          - "--instance-created"
          - "{{steps.launch_telemetry_peer.instance_created | default('false')}}"
          - "--leaked-zones"
          - "none"
          - "--firewall-name"
          - "{{steps.launch_telemetry_peer.firewall_name | default('none', true)}}"
          - "--firewall-created"
          - "{{steps.launch_telemetry_peer.firewall_created | default('false')}}"
          - "--key-file"
          - "none"
          - "--key-created"
          - "false"
          - "--delete-security-group"
          - "{{teardown_flag}}"
        timeout: 900

      # Delete the host, its SSH firewall, and the local key pair. Each id is
      # forwarded from launch_host with a non-empty default('none', true) sentinel
      # so a step-isolated slice with an unresolved upstream reference still runs
      # teardown; firewall/key deletes gate on the forwarded created bits.
      # Instance delete (300s op) + leaked-zone reclaim + firewall (180s op) +
      # retries; 900s margin.
      - name: teardown_host
        phase: teardown
        command: "python3 ../scripts/observability/teardown_host.py"
        args:
          - "--instance-id"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--region"
          - "{{region}}"
          - "--zone"
          - "{{steps.launch_host.zone | default('none', true)}}"
          - "--instance-created"
          - "{{steps.launch_host.instance_created | default('false')}}"
          - "--leaked-zones"
          - "{{steps.launch_host.leaked_zones | join(',') | default('none', true)}}"
          - "--firewall-name"
          - "{{steps.launch_host.firewall_name | default('none', true)}}"
          - "--firewall-created"
          - "{{steps.launch_host.firewall_created | default('false')}}"
          - "--key-file"
          - "{{steps.launch_host.key_file | default('none', true)}}"
          - "--key-created"
          - "{{steps.launch_host.key_created | default('false')}}"
          - "--delete-key-pair"
          - "--delete-security-group"
          - "{{teardown_flag}}"
        timeout: 900

      # 25. Disable VPC Flow Logs on ONLY the exact patched_flow_log_subnets
      # allowlist forwarded from enable_vpc_flow_logs (never the observed
      # diagnostic list) so operator-owned / other-run logging is never touched.
      # Gated on flow_logs_created. One regional patch op per subnet + retries;
      # 300s margin.
      - name: teardown_flow_logs
        phase: teardown
        command: "python3 ../scripts/observability/teardown_vpc_flow_logs.py"
        args:
          - "--region"
          - "{{region}}"
          - "--subnet-ids"
          - "{{steps.enable_vpc_flow_logs.patched_flow_log_subnets | join(',') | default('none', true)}}"
          - "--flow-logs-created"
          - "{{steps.enable_vpc_flow_logs.flow_logs_created | default('false')}}"
          - "{{teardown_flag}}"
        timeout: 300

      # 26. Delete run-owned dependencies then the VPC. Ownership is EXACT: the
      # instance only by --launch-instance in --instance-zone (+ any leaked zone),
      # the firewall only by exact --firewall-name gated on --firewall-created,
      # subnetworks only from the --created-subnets allowlist, the VPC last gated
      # on --network-created. teardown_host already removed the host+firewall, so
      # those deletes are idempotent NotFound no-ops here (defense in depth before
      # the network delete). Dependency-in-use is retried; 900s margin.
      - name: teardown_network
        phase: teardown
        command: "python3 ../scripts/observability/teardown_network.py"
        args:
          - "--vpc-id"
          - "{{steps.create_network.network_id | default('none', true)}}"
          - "--region"
          - "{{region}}"
          - "--network-created"
          - "{{steps.create_network.network_created | default('false')}}"
          - "--launch-instance"
          - "{{steps.launch_host.instance_id | default('none', true)}}"
          - "--instance-created"
          - "{{steps.launch_host.instance_created | default('false')}}"
          - "--instance-zone"
          - "{{steps.launch_host.zone | default('none', true)}}"
          - "--leaked-zones"
          - "{{steps.launch_host.leaked_zones | join(',') | default('none', true)}}"
          - "--firewall-name"
          - "{{steps.launch_host.firewall_name | default('none', true)}}"
          - "--firewall-created"
          - "{{steps.launch_host.firewall_created | default('false')}}"
          - "--created-subnets"
          - "{{steps.create_network.created_subnets | join(',') | default('none', true)}}"
          - "{{teardown_flag}}"
        timeout: 900

tests:
  platform: observability
  cluster_name: "gcp-observability-validation"
  description: "GCP Compute Engine VPC Flow Logs + guest syslog observability validation"

  settings:
    # All GCP_OBSERVABILITY_* vars are OPTIONAL overrides with safe public
    # defaults (env-Jinja reads so an operator can override without editing
    # code). NETWORK_FIREWALL_TRUST_IP is the only value an operator MUST set —
    # it is read inside launch_host.py (no open-internet fallback for SSH).
    region: "{{env.GCP_OBSERVABILITY_REGION | default('us-central1', true)}}"
    network_cidr: "{{env.GCP_OBSERVABILITY_NETWORK_CIDR | default('10.240.0.0/16', true)}}"
    instance_type: "{{env.GCP_OBSERVABILITY_INSTANCE_TYPE | default('e2-standard-2', true)}}"
    image: "{{env.GCP_OBSERVABILITY_IMAGE | default('ubuntu-2204-lts', true)}}"
    image_project: "{{env.GCP_OBSERVABILITY_IMAGE_PROJECT | default('ubuntu-os-cloud', true)}}"
    ssh_user: "{{env.GCP_OBSERVABILITY_SSH_USER | default('ubuntu', true)}}"
    # OPTIONAL. GCP_OBSERVABILITY_SKIP_TEARDOWN=true -> preserve the run-created
    # resources (host instance, local SSH key pair, SSH firewall rule, created
    # subnetworks, VPC Flow Logs configuration, VPC network) plus the internal
    # telemetry peer instance and the telemetry peer firewall rule (a
    # source-scoped ICMP rule), forwarded as --skip-destroy to all four teardown
    # steps. The same flag also reaches the three setup producers (create_network,
    # launch_host, launch_telemetry_peer): there --skip-destroy suppresses the
    # compensating deletion a setup FAILURE would otherwise run, so a partially
    # created run is preserved for inspection with its exact ownership identifiers.
    # Unset -> teardown runs and setup failures compensate normally.
    teardown_flag: "{{(env.GCP_OBSERVABILITY_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"

  # All twenty observability validators are enabled for GCP; none is excluded.
  # The ten provider-owned physical planes (management + NVSwitch fabric,
  # GPU/switch NVLink, fabric-manager / UFM / subnet-manager / switch logs) pass
  # the validator provider-hidden path after a real get_project identity probe,
  # and the six tenant-visible planes (telemetry delivery, north/south + east/west
  # network, host NIC, storage capacity/performance) emit concrete Cloud Logging
  # vpc_flows / Cloud Monitoring / guest-df evidence generated by a bounded
  # run-scoped traffic / I-O fixture. The suite's own exclude.labels: [] is
  # inherited unchanged.
