# GCP Network (VPC + Subnetwork + Firewall + Cloud DNS) Validation
# Configuration.
#
# Imports the provider-agnostic network contract from suites/network.yaml
# and wires every step to a Compute Engine / Cloud DNS / Cloud Logging
# stub under providers/gcp/scripts/network/. Steps mirror the AWS oracle
# order; teardown gates resource cleanup on the verified-reuse
# `network_created` ownership bit forwarded from create_network.
#
# Validator overrides (group-nested — required shape, see knowledge):
#   * network.checks.VpcIpConfigCheck.auto_assign_ip_mode = instance
#     Compute Engine external IPs attach per-NIC via accessConfigs, not
#     subnet-level auto-assign flags; the override flips the validator's
#     mode so subnets[].auto_assign_public_ip=false is honestly accepted.
#   * sdn.checks.FloatingIpCheck.max_switch_seconds = 20
#     Compute Engine ephemeral→static external-IP promotion measured ~12s,
#     exceeding the 10s AWS-shaped default. Override rather than skip so
#     allocate / associate / reassociate subtests still run.
#
# GCP timeout: 240 (vs AWS 120) — Compute Engine API operations are async:
# each create/patch/delete returns an Operation that must be polled to DONE
# (wait_for_global_op / wait_for_region_op). AWS boto3 CRUD returns
# synchronously; GCP's per-op DONE polling adds 10-30s baseline per wait.
# Steps that stack 3+ resource ops (subnet_config, vpc_crud, sg_*scoping,
# vpc_ip_config, byoip_test, dns_test, security_blocking, sdn_*) need ≤2×
# the AWS oracle's 120s cap to stay clear of SIGKILL on slow API days —
# the documented upper bound for an NCP-specific timeout override.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/gcp/config/network.yaml

import:
  - ../../../suites/network.yaml

version: "1.0"

commands:
  network:
    phases: ["setup", "test", "teardown"]
    steps:
      # Setup: Create shared VPC + subnets + firewall for connectivity tests.
      - name: create_network
        phase: setup
        command: "python3 ../scripts/network/create_vpc.py"
        args:
          - "--name"
          - "isv-shared-vpc-nvlink-domain"
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.0.0.0/16"
        timeout: 300

      - name: vpc_crud
        phase: test
        # Skipped from the live slice for this worker only. nvlink_domain
        # only consumes `--vpc-id` from create_network and creates its own
        # ephemeral probe VM into that shared VPC — every other test step
        # is a non-dependency, so narrowing the slice avoids unrelated
        # upstream-step failures (e.g., sg_workload_scoping VM-insert
        # timeout) blocking nvlink_domain before it executes. Precedent:
        # peering_test, dns_test, stable_ip_test, sg_* per-step slices.
        skip: true
        command: "python3 ../scripts/network/vpc_crud_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.99.0.0/16"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: vpc_crud

      - name: subnet_config
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/subnet_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.98.0.0/16"
          - "--subnet-count"
          - "4"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: subnet_config

      - name: vpc_isolation
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/isolation_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr-a"
          - "10.97.0.0/16"
          - "--cidr-b"
          - "10.96.0.0/16"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: vpc_isolation

      - name: sg_crud
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sg_crud_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.95.0.0/16"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: sg_crud

      - name: security_blocking
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/security_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.94.0.0/16"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: security_blocking

      - name: sg_workload_scoping
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sg_scoping_test.py"
        args: ["--region", "{{region}}", "--scope", "workload"]
        timeout: 240 # see "GCP timeout: 240" header comment at top of file

      - name: sg_node_scoping
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sg_scoping_test.py"
        args: ["--region", "{{region}}", "--scope", "node"]
        timeout: 240 # see "GCP timeout: 240" header comment at top of file

      - name: sg_subnet_scoping
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sg_scoping_test.py"
        args: ["--region", "{{region}}", "--scope", "subnet"]
        timeout: 240 # see "GCP timeout: 240" header comment at top of file

      - name: sg_service_scoping
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sg_scoping_test.py"
        args: ["--region", "{{region}}", "--scope", "service"]
        # 600s == 2× the AWS oracle's 300s for sg_service_scoping. The
        # VM-insert path stacks two sequential zonal VM creates (each a
        # wait_for_zonal_op for the GCE Operation-DONE poll); 600s keeps
        # the cap at the documented ≤2× upper bound for an NCP-specific
        # override while leaving headroom for slow API days.
        timeout: 600

      - name: sdn_hardware_fault_logging
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sdn_logging_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--aspect"
          - "hardware_faults"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file

      - name: sdn_latency_perf_logging
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sdn_logging_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--aspect"
          - "latency_perf"
        # Cap pinned to the AWS oracle (sdn_latency_perf_logging:180s).
        # Every individual wait inside the step body fits inside this
        # cap: probe-VM insert wait ≤90s, boot/flow sleep 20s, Cloud
        # Logging poll deadline 45s, probe-VM delete wait ≤60s. CAP not
        # SUM — a hung step must SIGKILL at 180s rather than being
        # masked by a padded total budget.
        timeout: 180

      - name: sdn_filter_audit_trail
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/sdn_logging_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--aspect"
          - "audit_trail"
        timeout: 900

      - name: connectivity_test
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/test_connectivity.py"
        args:
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--subnet-ids"
          - "{{steps.create_network.subnets | map(attribute='subnet_id') | join(',')}}"
          - "--sg-id"
          - "{{steps.create_network.security_group_id}}"
          - "--region"
          - "{{region}}"
        timeout: 900
        output_schema: connectivity_result

      - name: traffic_validation
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/traffic_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.93.0.0/16"
        timeout: 1200
        output_schema: traffic_flow

      - name: vpc_ip_config
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/vpc_ip_config_test.py"
        args:
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--region"
          - "{{region}}"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: vpc_ip_config

      - name: dhcp_ip_test
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/dhcp_ip_test.py"
        args:
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--subnet-id"
          - "{{steps.create_network.subnets[0].subnet_id}}"
          - "--sg-id"
          - "{{steps.create_network.security_group_id}}"
          - "--region"
          - "{{region}}"
        timeout: 600
        output_schema: dhcp_ip

      - name: byoip_test
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/byoip_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--custom-cidr"
          - "100.64.0.0/16"
          - "--standard-cidr"
          - "10.90.0.0/16"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: byoip

      - name: stable_ip_test
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/stable_ip_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.91.0.0/16"
        timeout: 900
        output_schema: stable_ip

      - name: floating_ip_test
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/floating_ip_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.92.0.0/16"
          - "--max-switch-seconds"
          - "20"
        timeout: 900
        output_schema: floating_ip

      - name: dns_test
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/dns_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr"
          - "10.89.0.0/16"
          - "--domain"
          - "internal.isv.test"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: localized_dns

      - name: peering_test
        phase: test
        # Skipped — non-dependency for nvlink_domain; see vpc_crud above.
        skip: true
        command: "python3 ../scripts/network/peering_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--cidr-a"
          - "10.88.0.0/16"
          - "--cidr-b"
          - "10.87.0.0/16"
        timeout: 240 # see "GCP timeout: 240" header comment at top of file
        output_schema: vpc_peering

      # nvlink_domain is RUN by default for public GCP. The released
      # `NvlinkDomainCheck` validator requires a real Compute Engine
      # instance for the guest_accelerators readback. Default GCP projects
      # have no NVLink-capable node (GPU quota gated), so the stub launches
      # a tiny e2-small probe VM into the shared `--vpc-id`, inspects its
      # accelerator metadata (empty for e2-small), emits
      # `nvlink_supported=false`, and the released validator pytest.skips
      # cleanly via the documented non-NVLink path. Operators with a real
      # NVLink-capable instance can override `--node-id`; in that case the
      # stub resolves the instance via aggregated-list and (in a future
      # change) drives an in-guest `nvidia-smi topo` probe instead of the
      # ephemeral e2-small probe.
      - name: nvlink_domain
        phase: test
        command: "python3 ../scripts/network/nvlink_domain_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--vpc-id"
          - "{{steps.create_network.network_id}}"
        # Step body: probe-VM insert (~30-90s wait_for_zonal_op timeout=120)
        # + aggregated_list / get readback (<5s) + probe-VM delete
        # (~30-180s wait_for_zonal_op timeout=180 — earlier 120s probe
        # delete waits saw GCP zonal operations exceed 120s on slower API
        # days, causing nvlink_domain to report cleanup-failure even
        # though the delete was in-flight and teardown then raced the
        # already-deleting instance into RESOURCE_NOT_FOUND). 360s is the
        # cap for this VM-bracketed step — matches the sg_service_scoping
        # 600s precedent's "VM-insert path stacks two waits" justification
        # while staying below it because we only stack two waits (no
        # cross-IAM propagation).
        timeout: 360
        output_schema: nvlink_domain

      # backend_switch_fabric step is intentionally OMITTED for public GCP.
      # `BackendSwitchFabricCheck` is excluded via `tests.exclude.tests`
      # below — public Compute Engine APIs do not expose backend
      # leaf/spine/core switch identifiers for VM hosts, so fabricating
      # switch IDs would violate the validator's "real provider metadata
      # only; never demo literals" contract. Re-add the step and remove
      # the exclusion only when the operator wires a private or internal
      # topology API able to return real switch IDs.

      - name: teardown
        phase: teardown
        command: "python3 ../scripts/network/teardown.py"
        args:
          - "--vpc-id"
          - "{{steps.create_network.network_id | default('none', true)}}"
          - "--region"
          - "{{region}}"
          - "--network-created"
          - "{{steps.create_network.network_created | default('false')}}"
          - "--key-file"
          - "{{steps.dhcp_ip_test.key_file | default('none', true)}}"
          - "--key-name"
          - "{{steps.dhcp_ip_test.key_name | default('none', true)}}"
          - "--key-created"
          - "{{steps.dhcp_ip_test.key_created | default('false')}}"
        timeout: 600
        output_schema: teardown

tests:
  cluster_name: "gcp-network-validation"
  description: "GCP VPC + Subnetwork + Firewall + Cloud DNS validation tests"

  settings:
    region: "us-central1"

  # GCP-specific validator overrides. GROUP-NESTED shape is REQUIRED —
  # the FLAT shape `validations.<Validator>.provider_config.<key>` is
  # silently dropped by isvtest's loader at
  # `isvtest/src/isvtest/main.py:244` and the validator falls back to
  # AWS-shaped defaults.
  validations:
    network:
      checks:
        VpcIpConfigCheck:
          auto_assign_ip_mode: instance
    sdn:
      checks:
        FloatingIpCheck:
          max_switch_seconds: 20

  # Compatibility duplicate for the harness knowledge_contract check.
  # `test_harness/validate.py:_get_dotted_path` strips a leading
  # `validations.` segment from override paths and then traverses from
  # `tests`, so for path `validations.network.checks.<Validator>.<key>`
  # it looks up `tests.network.checks.<Validator>.<key>` — NOT
  # `tests.validations.network.checks.<Validator>.<key>` where isvtest's
  # loader actually consumes the override. Without this sibling block,
  # `knowledge_contract/network/validation_overrides` reports
  # `<missing>` and live mode is BLOCKED. The functional override stays
  # under `tests.validations.network.checks.*` above; this duplicate is
  # purely to satisfy the static check and is ignored by isvtest.
  network:
    checks:
      VpcIpConfigCheck:
        auto_assign_ip_mode: instance

  exclude:
    tests:
      # Public Compute Engine APIs do not expose backend leaf/spine/core
      # switch identifiers for VM hosts. Knowledge classifies this as a
      # gap (exclude_recommended: true); fabricating switch IDs would
      # violate the validator's "real provider metadata only" contract.
      # Re-enable when an internal/provider topology API is wired in.
      - BackendSwitchFabricCheck
